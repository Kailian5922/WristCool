name: Build and Release WristCool

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest :phone:testDebugUnitTest --stacktrace

      - name: Decode Release Signing Keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" ]]; then
            if [[ -z "$RELEASE_KEYSTORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is set, but one of RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD is missing."
              exit 1
            fi
            KEYSTORE_FILE="${{ runner.temp }}/wristcool-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded successfully."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) are not configured. Falling back to debug keystore."
          fi

      - name: Build Wear & Phone Release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :phone:assembleRelease --stacktrace

      - name: Verify Fixed Package Names and Signatures
        run: |
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          WEAR_APK="app/build/outputs/apk/release/app-release.apk"
          PHONE_APK="phone/build/outputs/apk/release/phone-release.apk"

          WEAR_PKG="$("$AAPT2" dump packagename "$WEAR_APK")"
          PHONE_PKG="$("$AAPT2" dump packagename "$PHONE_APK")"

          echo "Wear APK package: $WEAR_PKG"
          echo "Phone APK package: $PHONE_PKG"

          if [[ "$WEAR_PKG" != "com.coolapk.wear" ]]; then
            echo "::error::Unexpected wear package name: $WEAR_PKG (expected com.coolapk.wear)"
            exit 1
          fi
          if [[ "$PHONE_PKG" != "com.coolapk.wear.companion" ]]; then
            echo "::error::Unexpected phone package name: $PHONE_PKG (expected com.coolapk.wear.companion)"
            exit 1
          fi

          echo "Verifying Wear APK signature:"
          "$APKSIGNER" verify --print-certs "$WEAR_APK"
          echo "Verifying Phone APK signature:"
          "$APKSIGNER" verify --print-certs "$PHONE_APK"

      - name: Cleanup Release Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/wristcool-release.jks"

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_apks
          APP_VERSION="$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION_TAG="${{ github.event.inputs.version }}"
          fi
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="v${APP_VERSION:-1.1.0}"
          fi
          echo "tag_name=$VERSION_TAG" >> "$GITHUB_OUTPUT"

          cp app/build/outputs/apk/release/app-release.apk "release_apks/WristCool-wear-${VERSION_TAG}.apk"
          cp phone/build/outputs/apk/release/phone-release.apk "release_apks/WristCool-phone-companion-${VERSION_TAG}.apk"

          echo "Generated APKs (signed=${{ steps.signing.outputs.signed }}):"
          ls -lh release_apks/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: WristCool-APKs-${{ steps.prepare_artifacts.outputs.tag_name }}
          path: release_apks/*

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: WristCool ${{ steps.prepare_artifacts.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## WristCool 腕酷版本发布 (${{ steps.prepare_artifacts.outputs.tag_name }})

            专为 Wear OS 智能手表与圆形表盘打造的第三方酷安客户端，包含手表独立端与手机伴侣端。

            ### 📦 安装包说明（固定包名）
            - ⌚ **手表端 (`WristCool-wear-${{ steps.prepare_artifacts.outputs.tag_name }}.apk`)**：包名 `com.coolapk.wear`，适用于 Wear OS 3.0+ (API 30+)
            - 📱 **手机伴侣端 (`WristCool-phone-companion-${{ steps.prepare_artifacts.outputs.tag_name }}.apk`)**：包名 `com.coolapk.wear.companion`，适用于 Android 8.0+ (API 26+)
          files: |
            release_apks/WristCool-wear-*.apk
            release_apks/WristCool-phone-companion-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
